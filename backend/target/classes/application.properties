server.port=${PORT:8080}

# Spring Application Name
spring.application.name=photography-backend

# Admin Security Key Header
admin.api-key=${ADMIN_API_KEY:default_secret_key_change_me}

# CORS Allowed Origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
